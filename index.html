<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PhoneStock</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  --bg: #14181c; --surface: #1b2127; --surface-2: #232b33; --border: #2d3640;
  --text: #e9edf1; --text-dim: #8b97a3; --accent: #e8a33d; --accent-dim: #4a3a1f;
  --green: #4fbf7a; --red: #d9635b; --blue: #5b9dd9;
  font-family: 'Manrope', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh;
}
.mono { font-family: 'JetBrains Mono', monospace; }
.shell { display: flex; min-height: 100vh; }
.sidebar { width: 210px; background: var(--surface); border-right: 1px solid var(--border); padding: 20px 12px; display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
.brand { display: flex; align-items: center; gap: 8px; padding: 6px 10px 16px 10px; font-weight: 800; font-size: 15px; }
.brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
.nav-section { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .08em; padding: 10px 12px 4px; }
.navbtn { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; border: none; background: transparent; color: var(--text-dim); font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; text-align: left; width: 100%; }
.navbtn:hover { background: var(--surface-2); color: var(--text); }
.navbtn.active { background: var(--accent-dim); color: var(--accent); }
.loc-switcher { margin: 0 8px 12px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 4px; display: flex; gap: 2px; }
.loc-btn { flex: 1; border: none; background: none; color: var(--text-dim); font-family: inherit; font-size: 11px; font-weight: 700; padding: 5px 4px; border-radius: 6px; cursor: pointer; }
.loc-btn.active { background: var(--accent); color: #1a1305; }
.main { flex: 1; padding: 24px 28px; overflow-y: auto; }
.headrow { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 18px; gap: 12px; flex-wrap: wrap; }
.headrow h1 { font-size: 18px; margin: 0; font-weight: 800; }
.headrow .sub { color: var(--text-dim); font-size: 12px; margin-top: 3px; }
.btn { display: inline-flex; align-items: center; gap: 6px; background: var(--accent); color: #1a1305; border: none; padding: 9px 14px; border-radius: 8px; font-weight: 700; font-size: 13px; cursor: pointer; font-family: inherit; }
.btn:disabled { opacity: .5; cursor: default; }
.btn.secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
.btn.danger { background: rgba(217,99,91,.15); color: var(--red); border: 1px solid rgba(217,99,91,.3); }
.statrow { display: flex; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.statcard { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; min-width: 120px; flex: 1; }
.statcard .label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }
.statcard .val { font-size: 20px; font-weight: 800; }
.searchbar { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; margin-bottom: 14px; max-width: 340px; }
.searchbar input { background: none; border: none; outline: none; color: var(--text); font-family: inherit; font-size: 13px; width: 100%; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; color: var(--text-dim); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; padding: 8px 10px; border-bottom: 1px solid var(--border); }
td { padding: 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tr:hover td { background: var(--surface); }
.badge { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; }
.badge.new { background: rgba(79,191,122,.15); color: var(--green); }
.badge.refurb { background: rgba(91,157,217,.15); color: var(--blue); }
.badge.loc { background: rgba(232,163,61,.15); color: var(--accent); font-size: 10px; }
.iconbtn { background: none; border: none; color: var(--text-dim); cursor: pointer; padding: 4px; font-size: 15px; }
.iconbtn:hover { color: var(--red); }
.empty { color: var(--text-dim); font-size: 13px; padding: 30px 10px; text-align: center; border: 1px dashed var(--border); border-radius: 10px; }
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
.modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 22px; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; }
.modal h2 { margin: 0 0 16px 0; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: space-between; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 11px; color: var(--text-dim); margin-bottom: 5px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; }
.field input, .field select, .field textarea { width: 100%; background: var(--surface-2); border: 1px solid var(--border); border-radius: 7px; padding: 8px 10px; color: var(--text); font-family: inherit; font-size: 13px; outline: none; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.col { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px; min-height: 80px; }
.col-head { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; margin-bottom: 10px; color: var(--text-dim); }
.dot-sm { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.card { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-bottom: 8px; font-size: 12.5px; }
.card .cust { font-weight: 700; margin-bottom: 2px; }
.card .dev { color: var(--text-dim); font-size: 11px; margin-bottom: 4px; }
.card .issue { margin-bottom: 6px; line-height: 1.4; font-size: 12px; }
.card .parts-list { margin-bottom: 6px; }
.card .part-item { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-dim); padding: 2px 0; border-bottom: 1px solid var(--border); }
.card select { width: 100%; font-size: 11px; padding: 5px 6px; }
.card .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
.part-add-row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
.part-add-row select { flex: 1; font-size: 12px; padding: 5px 8px; }
.part-add-row input { width: 60px; font-size: 12px; padding: 5px 8px; }
.part-add-row button { font-size: 12px; padding: 5px 10px; }
.errbar { background: rgba(217,99,91,.15); color: var(--red); padding: 8px 12px; border-radius: 8px; font-size: 12.5px; margin-bottom: 12px; }
.toggle-link { color: var(--text-dim); font-size: 12px; cursor: pointer; text-decoration: underline; margin-top: 14px; display: inline-block; }
.divider { height: 1px; background: var(--border); margin: 14px 0; }
.stock-low { color: var(--red); }
@media (max-width: 768px) {
  .shell { flex-direction: column; }
  .sidebar { width: 100%; flex-direction: row; flex-wrap: wrap; border-right: none; border-bottom: 1px solid var(--border); }
  .board { grid-template-columns: 1fr 1fr; }
  .row2, .row3 { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect, useMemo, useCallback } = React;

const SUPABASE_URL = "https://aaiyyhskvxjqfhrgoulh.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFhaXl5aHNrdnhqcWZocmdvdWxoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxMjE1NTMsImV4cCI6MjEwMTY5NzU1M30.2_dLpIgo8El8Iu0O7ucYpPDgJXXO_esMte_se7ngp3A";

async function sb(path, opts = {}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...opts,
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, "Content-Type": "application/json", Prefer: opts.prefer || "return=representation", ...(opts.headers||{}) }
  });
  if (!res.ok) throw new Error(await res.text().catch(()=>""));
  const t = await res.text(); return t ? JSON.parse(t) : null;
}

const money = n => (Number(n)||0).toLocaleString("hu-HU") + " Lei";
const today = () => new Date().toISOString().slice(0,10);

const STATUSES = [
  { key:"received", label:"Bejövő", color:"#5b9dd9" },
  { key:"in_progress", label:"Javítás alatt", color:"#e8a33d" },
  { key:"waiting_parts", label:"Alkatrészre vár", color:"#d9635b" },
  { key:"ready", label:"Kész, átvehető", color:"#4fbf7a" },
  { key:"picked_up", label:"Átvéve", color:"#6b7480" },
];

// mappers
const pFromApi = r => ({ id:r.id, brand:r.brand, model:r.model, condition:r.condition, grade:r.grade, storage:r.storage, color:r.color, imei:r.imei, costPrice:r.cost_price, salePrice:r.sale_price, status:r.status, locationId:r.location_id });
const pToApi = (p, locId) => ({ brand:p.brand, model:p.model, condition:p.condition, grade:p.grade||null, storage:p.storage||null, color:p.color||null, imei:p.imei||null, cost_price:Number(p.costPrice)||0, sale_price:Number(p.salePrice)||0, location_id:locId });
const saleFromApi = r => ({ id:r.id, stockId:r.product_id, productLabel:r.product_label, costPrice:r.cost_price, price:r.price, customerName:r.customer_name, customerPhone:r.customer_phone, payment:r.payment, date:r.sale_date, locationId:r.location_id });
const saleToApi = (s,locId) => ({ product_id:s.stockId, product_label:s.productLabel, cost_price:Number(s.costPrice)||0, price:Number(s.price)||0, customer_name:s.customerName||null, customer_phone:s.customerPhone||null, payment:s.payment, location_id:locId });
const tFromApi = r => ({ id:r.id, customerName:r.customer_name, customerPhone:r.customer_phone, device:r.device, issue:r.issue, price:r.price, status:r.status, dateIn:r.date_in, dateOut:r.date_out, locationId:r.location_id, parts:[] });
const tToApi = (t,locId) => ({ customer_name:t.customerName, customer_phone:t.customerPhone||null, device:t.device, issue:t.issue, price:Number(t.price)||0, location_id:locId });
const partFromApi = r => ({ id:r.id, name:r.name, brand:r.brand, modelFit:r.model_fit, quantity:r.quantity, costPrice:r.cost_price, salePrice:r.sale_price });
const partToApi = p => ({ name:p.name, brand:p.brand||null, model_fit:p.modelFit||null, quantity:Number(p.quantity)||0, cost_price:Number(p.costPrice)||0, sale_price:Number(p.salePrice)||0 });

function App() {
  const [tab, setTab] = useState("stock");
  const [locFilter, setLocFilter] = useState("all"); // "all" | location id
  const [locations, setLocations] = useState([]);
  const [stock, setStock] = useState([]);
  const [sales, setSales] = useState([]);
  const [tickets, setTickets] = useState([]);
  const [parts, setParts] = useState([]);
  const [loading, setLoading] = useState(true);
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");
  const [showPickedUp, setShowPickedUp] = useState(false);
  const [search, setSearch] = useState("");
  // modals
  const [stockModal, setStockModal] = useState(false);
  const [saleModal, setSaleModal] = useState(null); // product obj
  const [serviceModal, setServiceModal] = useState(false);
  const [partModal, setPartModal] = useState(false);

  async function loadAll() {
    setLoading(true);
    try {
      const [locs, prods, sls, tcks, prs] = await Promise.all([
        sb("locations?order=name.asc"),
        sb("products?order=created_at.desc"),
        sb("sales?order=created_at.desc"),
        sb("service_tickets?order=created_at.desc"),
        sb("parts?order=name.asc"),
      ]);
      setLocations(locs||[]);
      setStock((prods||[]).map(pFromApi));
      setSales((sls||[]).map(saleFromApi));
      // load ticket parts
      const spRes = await sb("service_parts?select=*");
      const spMap = {};
      (spRes||[]).forEach(sp => {
        if (!spMap[sp.service_ticket_id]) spMap[sp.service_ticket_id] = [];
        spMap[sp.service_ticket_id].push(sp);
      });
      setTickets((tcks||[]).map(t => ({ ...tFromApi(t), parts: spMap[t.id]||[] })));
      setParts((prs||[]).map(partFromApi));
      setError("");
    } catch(e) { setError("Betöltési hiba: " + e.message); }
    finally { setLoading(false); }
  }

  useEffect(() => { loadAll(); }, []);

  async function withBusy(fn) {
    setBusy(true);
    try { await fn(); setError(""); }
    catch(e) { setError(e.message||"Hiba történt."); }
    finally { setBusy(false); }
  }

  const activeLoc = locFilter === "all" ? null : locations.find(l => l.id === locFilter);

  // STOCK
  async function addProduct(data, locId) {
    await withBusy(async () => {
      const r = await sb("products", { method:"POST", body:JSON.stringify(pToApi(data, locId)) });
      setStock([pFromApi(r[0]), ...stock]);
      setStockModal(false);
    });
  }
  async function deleteProduct(id) {
    await withBusy(async () => {
      await sb(`products?id=eq.${id}`, { method:"DELETE", prefer:"return=minimal" });
      setStock(stock.filter(i => i.id !== id));
    });
  }
  async function confirmSale(sale, locId) {
    await withBusy(async () => {
      await sb(`products?id=eq.${sale.stockId}`, { method:"PATCH", prefer:"return=minimal", body:JSON.stringify({ status:"sold" }) });
      const r = await sb("sales", { method:"POST", body:JSON.stringify(saleToApi(sale, locId)) });
      setStock(stock.map(i => i.id === sale.stockId ? { ...i, status:"sold" } : i));
      setSales([saleFromApi(r[0]), ...sales]);
      setSaleModal(null);
    });
  }

  // PARTS
  async function addPart(data) {
    await withBusy(async () => {
      const r = await sb("parts", { method:"POST", body:JSON.stringify(partToApi(data)) });
      setParts([partFromApi(r[0]), ...parts]);
      setPartModal(false);
    });
  }
  async function deletePart(id) {
    await withBusy(async () => {
      await sb(`parts?id=eq.${id}`, { method:"DELETE", prefer:"return=minimal" });
      setParts(parts.filter(p => p.id !== id));
    });
  }

  // SERVICE
  async function addTicket(data, locId) {
    await withBusy(async () => {
      const r = await sb("service_tickets", { method:"POST", body:JSON.stringify(tToApi(data, locId)) });
      setTickets([{ ...tFromApi(r[0]), parts:[] }, ...tickets]);
      setServiceModal(false);
    });
  }
  async function setTicketStatus(id, status) {
    await withBusy(async () => {
      const patch = { status };
      if (status === "picked_up") patch.date_out = today();
      await sb(`service_tickets?id=eq.${id}`, { method:"PATCH", prefer:"return=minimal", body:JSON.stringify(patch) });
      setTickets(tickets.map(t => t.id===id ? { ...t, status, dateOut: status==="picked_up"?today():t.dateOut } : t));
    });
  }
  async function deleteTicket(id) {
    await withBusy(async () => {
      await sb(`service_tickets?id=eq.${id}`, { method:"DELETE", prefer:"return=minimal" });
      setTickets(tickets.filter(t => t.id !== id));
    });
  }
  async function addPartToTicket(ticketId, part, qty) {
    await withBusy(async () => {
      const unitPrice = Number(part.salePrice)||0;
      const totalAdd = unitPrice * qty;
      // insert service_part
      await sb("service_parts", { method:"POST", body:JSON.stringify({ service_ticket_id:ticketId, part_id:part.id, part_name:part.name, quantity:qty, unit_price:unitPrice }) });
      // reduce parts stock
      const newQty = (Number(part.quantity)||0) - qty;
      await sb(`parts?id=eq.${part.id}`, { method:"PATCH", prefer:"return=minimal", body:JSON.stringify({ quantity:newQty }) });
      // update ticket price
      const ticket = tickets.find(t => t.id===ticketId);
      const newPrice = (Number(ticket.price)||0) + totalAdd;
      await sb(`service_tickets?id=eq.${ticketId}`, { method:"PATCH", prefer:"return=minimal", body:JSON.stringify({ price:newPrice }) });
      // add to sales as service part sale
      const loc = ticket.locationId;
      await sb("sales", { method:"POST", body:JSON.stringify({ product_id:null, product_label:`Alkatrész: ${part.name} (${qty}x) — szerviz`, cost_price:(Number(part.costPrice)||0)*qty, price:totalAdd, customer_name:ticket.customerName, customer_phone:ticket.customerPhone, payment:"Szerviz", location_id:loc }) });
      // refresh
      const spRes = await sb("service_parts?select=*");
      const spMap = {};
      (spRes||[]).forEach(sp => { if (!spMap[sp.service_ticket_id]) spMap[sp.service_ticket_id]=[];  spMap[sp.service_ticket_id].push(sp); });
      const newSales = await sb("sales?order=created_at.desc");
      setTickets(tickets.map(t => ({ ...t, price: t.id===ticketId ? newPrice : t.price, parts: spMap[t.id]||[] })));
      setParts(parts.map(p => p.id===part.id ? { ...p, quantity:newQty } : p));
      setSales((newSales||[]).map(saleFromApi));
    });
  }

  // FILTERED DATA
  const filteredStock = useMemo(() => {
    let s = stock.filter(i => i.status==="in_stock");
    if (locFilter !== "all") s = s.filter(i => i.locationId === locFilter);
    const q = search.trim().toLowerCase();
    if (q) s = s.filter(i => [i.brand,i.model,i.imei,i.color,i.storage].join(" ").toLowerCase().includes(q));
    return s;
  }, [stock, locFilter, search]);

  const filteredSales = useMemo(() => {
    if (locFilter === "all") return sales;
    return sales.filter(s => s.locationId === locFilter);
  }, [sales, locFilter]);

  const filteredTickets = useMemo(() => {
    if (locFilter === "all") return tickets;
    return tickets.filter(t => t.locationId === locFilter);
  }, [tickets, locFilter]);

  const stockStats = useMemo(() => {
    const inStock = filteredStock;
    return { count:inStock.length, value:inStock.reduce((s,i)=>s+(Number(i.salePrice)||0),0), cost:inStock.reduce((s,i)=>s+(Number(i.costPrice)||0),0) };
  }, [filteredStock]);

  const salesStats = useMemo(() => ({
    count: filteredSales.length,
    revenue: filteredSales.reduce((s,x)=>s+(Number(x.price)||0),0),
    profit: filteredSales.reduce((s,x)=>s+((Number(x.price)||0)-(Number(x.costPrice)||0)),0),
  }), [filteredSales]);

  const activeTickets = useMemo(() => filteredTickets.filter(t => t.status !== "picked_up"), [filteredTickets]);
  const doneTickets = useMemo(() => filteredTickets.filter(t => t.status === "picked_up"), [filteredTickets]);

  const locName = id => { const l = locations.find(x=>x.id===id); return l ? l.name : "—"; };

  return (
    <div className="shell">
      <div className="sidebar">
        <div className="brand"><span className="dot"></span> PhoneStock</div>

        <div className="loc-switcher">
          <button className={`loc-btn ${locFilter==="all"?"active":""}`} onClick={()=>setLocFilter("all")}>Mindkettő</button>
          {locations.map(l => (
            <button key={l.id} className={`loc-btn ${locFilter===l.id?"active":""}`} onClick={()=>setLocFilter(l.id)}>{l.name}</button>
          ))}
        </div>

        <div className="nav-section">Értékesítés</div>
        <button className={`navbtn ${tab==="stock"?"active":""}`} onClick={()=>setTab("stock")}>📱 Készlet</button>
        <button className={`navbtn ${tab==="sales"?"active":""}`} onClick={()=>setTab("sales")}>🛒 Eladások</button>
        <div className="nav-section">Szerviz</div>
        <button className={`navbtn ${tab==="service"?"active":""}`} onClick={()=>setTab("service")}>🔧 Munkalapok</button>
        <div className="nav-section">Raktár</div>
        <button className={`navbtn ${tab==="parts"?"active":""}`} onClick={()=>setTab("parts")}>🔩 Alkatrészek</button>
      </div>

      <div className="main">
        {error && <div className="errbar">{error}</div>}

        {/* ===== KÉSZLET ===== */}
        {tab==="stock" && <>
          <div className="headrow">
            <div><h1>Készlet</h1><div className="sub">{locFilter==="all" ? "Mindkét helyszín" : locName(locFilter)}</div></div>
            <button className="btn" disabled={busy} onClick={()=>setStockModal(true)}>+ Új termék</button>
          </div>
          <div className="statrow">
            <div className="statcard"><div className="label">Raktáron</div><div className="val">{stockStats.count} db</div></div>
            <div className="statcard"><div className="label">Készlet értéke</div><div className="val">{money(stockStats.value)}</div></div>
            <div className="statcard"><div className="label">Beszerzési érték</div><div className="val">{money(stockStats.cost)}</div></div>
          </div>
          <div className="searchbar"><input placeholder="Keresés márka, modell, IMEI..." value={search} onChange={e=>setSearch(e.target.value)} /></div>
          {loading ? <div className="empty">Betöltés...</div> : filteredStock.length===0 ? <div className="empty">Nincs termék.</div> : (
            <table>
              <thead><tr><th>Termék</th><th>Helyszín</th><th>Állapot</th><th>Tárhely/Szín</th><th>IMEI</th><th>Besz.</th><th>Eladási ár</th><th></th></tr></thead>
              <tbody>
                {filteredStock.map(i => (
                  <tr key={i.id}>
                    <td><strong>{i.brand} {i.model}</strong></td>
                    <td><span className="badge loc">{locName(i.locationId)}</span></td>
                    <td><span className={`badge ${i.condition==="New"?"new":"refurb"}`}>{i.condition==="New"?"Új":`Felúj.${i.grade?" "+i.grade:""}`}</span></td>
                    <td className="mono">{[i.storage,i.color].filter(Boolean).join(" / ")||"—"}</td>
                    <td className="mono" style={{fontSize:11,color:"var(--text-dim)"}}>{i.imei||"—"}</td>
                    <td className="mono">{money(i.costPrice)}</td>
                    <td className="mono"><strong>{money(i.salePrice)}</strong></td>
                    <td style={{display:"flex",gap:4}}>
                      <button className="btn secondary" style={{padding:"5px 9px",fontSize:11}} disabled={busy} onClick={()=>setSaleModal(i)}>Eladva</button>
                      <button className="iconbtn" disabled={busy} onClick={()=>deleteProduct(i.id)}>🗑</button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </>}

        {/* ===== ELADÁSOK ===== */}
        {tab==="sales" && <>
          <div className="headrow">
            <div><h1>Eladások</h1><div className="sub">{locFilter==="all"?"Mindkét helyszín összesítve":locName(locFilter)}</div></div>
          </div>
          <div className="statrow">
            <div className="statcard"><div className="label">Eladások</div><div className="val">{salesStats.count}</div></div>
            <div className="statcard"><div className="label">Árbevétel</div><div className="val">{money(salesStats.revenue)}</div></div>
            <div className="statcard"><div className="label">Profit</div><div className="val" style={{color:"var(--green)"}}>{money(salesStats.profit)}</div></div>
          </div>
          {loading ? <div className="empty">Betöltés...</div> : filteredSales.length===0 ? <div className="empty">Nincs eladás.</div> : (
            <table>
              <thead><tr><th>Dátum</th><th>Termék</th><th>Helyszín</th><th>Vevő</th><th>Fizetés</th><th>Ár</th><th>Profit</th></tr></thead>
              <tbody>
                {filteredSales.map(s => (
                  <tr key={s.id}>
                    <td className="mono">{s.date}</td>
                    <td><strong>{s.productLabel}</strong></td>
                    <td><span className="badge loc">{locName(s.locationId)}</span></td>
                    <td>{s.customerName||"—"}{s.customerPhone?` · ${s.customerPhone}`:""}</td>
                    <td>{s.payment}</td>
                    <td className="mono">{money(s.price)}</td>
                    <td className="mono" style={{color:"var(--green)"}}>{money((Number(s.price)||0)-(Number(s.costPrice)||0))}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </>}

        {/* ===== SZERVIZ ===== */}
        {tab==="service" && <>
          <div className="headrow">
            <div><h1>Szerviz</h1><div className="sub">{locFilter==="all"?"Mindkét helyszín":locName(locFilter)}</div></div>
            <button className="btn" disabled={busy} onClick={()=>setServiceModal(true)}>+ Új munkalap</button>
          </div>
          {loading ? <div className="empty">Betöltés...</div> : (
            <div className="board">
              {STATUSES.filter(s=>s.key!=="picked_up").map(col => {
                const items = activeTickets.filter(t=>t.status===col.key);
                return (
                  <div className="col" key={col.key}>
                    <div className="col-head"><span className="dot-sm" style={{background:col.color}}></span>{col.label} ({items.length})</div>
                    {items.length===0 && <div style={{color:"var(--text-dim)",fontSize:11}}>Üres</div>}
                    {items.map(t => (
                      <TicketCard key={t.id} ticket={t} parts={parts} locations={locations}
                        onStatusChange={setTicketStatus} onDelete={deleteTicket}
                        onAddPart={addPartToTicket} busy={busy} locName={locName} />
                    ))}
                  </div>
                );
              })}
            </div>
          )}
          <span className="toggle-link" onClick={()=>setShowPickedUp(v=>!v)}>
            {showPickedUp?"Átvett munkalapok elrejtése":`Átvett munkalapok (${doneTickets.length})`}
          </span>
          {showPickedUp && doneTickets.length>0 && (
            <table style={{marginTop:10}}>
              <thead><tr><th>Vevő</th><th>Helyszín</th><th>Eszköz</th><th>Hiba</th><th>Bejött</th><th>Kiadva</th><th>Díj</th></tr></thead>
              <tbody>
                {doneTickets.map(t=>(
                  <tr key={t.id}>
                    <td>{t.customerName}</td>
                    <td><span className="badge loc">{locName(t.locationId)}</span></td>
                    <td className="mono">{t.device}</td>
                    <td>{t.issue}</td>
                    <td className="mono">{t.dateIn}</td>
                    <td className="mono">{t.dateOut||"—"}</td>
                    <td className="mono">{money(t.price)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </>}

        {/* ===== ALKATRÉSZEK ===== */}
        {tab==="parts" && <>
          <div className="headrow">
            <div><h1>Alkatrész raktár</h1><div className="sub">Közös raktár — mindkét helyszín</div></div>
            <button className="btn" disabled={busy} onClick={()=>setPartModal(true)}>+ Új alkatrész</button>
          </div>
          <div className="statrow">
            <div className="statcard"><div className="label">Féleségek</div><div className="val">{parts.length} db</div></div>
            <div className="statcard"><div className="label">Raktár értéke</div><div className="val">{money(parts.reduce((s,p)=>s+(Number(p.costPrice)||0)*(Number(p.quantity)||0),0))}</div></div>
            <div className="statcard"><div className="label">Alacsony készlet</div><div className="val stock-low">{parts.filter(p=>Number(p.quantity)<=2).length} tétel</div></div>
          </div>
          {loading ? <div className="empty">Betöltés...</div> : parts.length===0 ? <div className="empty">Nincs alkatrész. Adj hozzá egyet fent.</div> : (
            <table>
              <thead><tr><th>Alkatrész</th><th>Márka/Illik</th><th>Készlet</th><th>Besz. ár/db</th><th>Elad. ár/db</th><th></th></tr></thead>
              <tbody>
                {parts.map(p=>(
                  <tr key={p.id}>
                    <td><strong>{p.name}</strong></td>
                    <td style={{fontSize:12,color:"var(--text-dim)"}}>{[p.brand,p.modelFit].filter(Boolean).join(" · ")||"—"}</td>
                    <td><span style={{color:Number(p.quantity)<=2?"var(--red)":"var(--green)",fontWeight:700}}>{p.quantity} db</span></td>
                    <td className="mono">{money(p.costPrice)}</td>
                    <td className="mono">{money(p.salePrice)}</td>
                    <td><button className="iconbtn" disabled={busy} onClick={()=>deletePart(p.id)}>🗑</button></td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </>}
      </div>

      {stockModal && <StockModal locations={locations} onClose={()=>setStockModal(false)} onSave={addProduct} busy={busy} defaultLocId={locFilter!=="all"?locFilter:locations[0]?.id} />}
      {saleModal && <SaleModal item={saleModal} locations={locations} onClose={()=>setSaleModal(null)} onSave={confirmSale} busy={busy} defaultLocId={saleModal.locationId||locations[0]?.id} />}
      {serviceModal && <ServiceModal locations={locations} onClose={()=>setServiceModal(false)} onSave={addTicket} busy={busy} defaultLocId={locFilter!=="all"?locFilter:locations[0]?.id} />}
      {partModal && <PartModal onClose={()=>setPartModal(false)} onSave={addPart} busy={busy} />}
    </div>
  );
}

function TicketCard({ ticket, parts, onStatusChange, onDelete, onAddPart, busy, locName }) {
  const [selPart, setSelPart] = useState("");
  const [qty, setQty] = useState(1);
  const [showAdd, setShowAdd] = useState(false);
  const chosen = parts.find(p=>p.id===selPart);

  return (
    <div className="card">
      <div className="cust">{ticket.customerName}{ticket.customerPhone?` · ${ticket.customerPhone}`:""}</div>
      <div className="dev">{ticket.device} · <span className="badge loc" style={{fontSize:10}}>{locName(ticket.locationId)}</span></div>
      <div className="issue">{ticket.issue}</div>
      {ticket.parts.length>0 && (
        <div className="parts-list">
          {ticket.parts.map((sp,i)=>(
            <div key={i} className="part-item">
              <span>{sp.part_name} ×{sp.quantity}</span>
              <span>{money((sp.unit_price||0)*sp.quantity)}</span>
            </div>
          ))}
        </div>
      )}
      <div style={{fontWeight:700,fontSize:12,marginBottom:6}}>{money(ticket.price)}</div>
      {showAdd ? (
        <div>
          <div className="part-add-row">
            <select value={selPart} onChange={e=>setSelPart(e.target.value)}>
              <option value="">— Alkatrész —</option>
              {parts.filter(p=>p.quantity>0).map(p=><option key={p.id} value={p.id}>{p.name} ({p.quantity} db)</option>)}
            </select>
            <input type="number" min="1" max={chosen?.quantity||1} value={qty} onChange={e=>setQty(Number(e.target.value))} />
            <button className="btn" style={{padding:"4px 10px",fontSize:11}} disabled={!selPart||busy} onClick={()=>{ if(chosen){ onAddPart(ticket.id,chosen,qty); setShowAdd(false); setSelPart(""); setQty(1); }}}>OK</button>
            <button className="iconbtn" onClick={()=>setShowAdd(false)}>✕</button>
          </div>
        </div>
      ) : (
        <button className="btn secondary" style={{width:"100%",fontSize:11,padding:"5px",marginBottom:6,justifyContent:"center"}} onClick={()=>setShowAdd(true)}>+ Alkatrész felhasználás</button>
      )}
      <select value={ticket.status} disabled={busy} onChange={e=>onStatusChange(ticket.id,e.target.value)}>
        {STATUSES.map(s=><option key={s.key} value={s.key}>{s.label}</option>)}
      </select>
      <div className="foot">
        <span style={{color:"var(--text-dim)",fontSize:11}}>{ticket.dateIn}</span>
        <button className="iconbtn" disabled={busy} onClick={()=>onDelete(ticket.id)}>🗑</button>
      </div>
    </div>
  );
}

function StockModal({ locations, onClose, onSave, busy, defaultLocId }) {
  const [f, setF] = useState({ brand:"", model:"", condition:"New", grade:"A", storage:"", color:"", imei:"", costPrice:"", salePrice:"" });
  const [locId, setLocId] = useState(defaultLocId||"");
  const set = k => e => setF({...f,[k]:e.target.value});
  const valid = f.brand.trim()&&f.model.trim()&&f.salePrice!==""&&locId;
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <h2>Új termék <button className="iconbtn" onClick={onClose}>✕</button></h2>
        <div className="field"><label>Helyszín</label>
          <select value={locId} onChange={e=>setLocId(e.target.value)}>
            {locations.map(l=><option key={l.id} value={l.id}>{l.name}</option>)}
          </select>
        </div>
        <div className="row2"><div className="field"><label>Márka</label><input value={f.brand} onChange={set("brand")} placeholder="Samsung" /></div><div className="field"><label>Modell</label><input value={f.model} onChange={set("model")} placeholder="Galaxy S23" /></div></div>
        <div className="row2">
          <div className="field"><label>Állapot</label><select value={f.condition} onChange={set("condition")}><option value="New">Új</option><option value="Refurbished">Felújított</option></select></div>
          {f.condition==="Refurbished"&&<div className="field"><label>Minőség</label><select value={f.grade} onChange={set("grade")}><option value="A">A (kiváló)</option><option value="B">B (jó)</option><option value="C">C (elfogadható)</option></select></div>}
        </div>
        <div className="row2"><div className="field"><label>Tárhely</label><input value={f.storage} onChange={set("storage")} placeholder="128GB" /></div><div className="field"><label>Szín</label><input value={f.color} onChange={set("color")} placeholder="Fekete" /></div></div>
        <div className="field"><label>IMEI</label><input value={f.imei} onChange={set("imei")} placeholder="35xxxxxxxxxxxxx" /></div>
        <div className="row2"><div className="field"><label>Beszerzési ár (Lei)</label><input type="number" value={f.costPrice} onChange={set("costPrice")} placeholder="0" /></div><div className="field"><label>Eladási ár (Lei)</label><input type="number" value={f.salePrice} onChange={set("salePrice")} placeholder="0" /></div></div>
        <div className="modal-actions"><button className="btn secondary" onClick={onClose}>Mégse</button><button className="btn" disabled={!valid||busy} onClick={()=>valid&&onSave(f,locId)}>{busy?"Mentés...":"Hozzáadás"}</button></div>
      </div>
    </div>
  );
}

function SaleModal({ item, locations, onClose, onSave, busy, defaultLocId }) {
  const [f, setF] = useState({ price:item.salePrice||"", customerName:"", customerPhone:"", payment:"Készpénz" });
  const [locId, setLocId] = useState(defaultLocId||"");
  const set = k => e => setF({...f,[k]:e.target.value});
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <h2>Eladás rögzítése <button className="iconbtn" onClick={onClose}>✕</button></h2>
        <div className="field"><label>Helyszín</label><select value={locId} onChange={e=>setLocId(e.target.value)}>{locations.map(l=><option key={l.id} value={l.id}>{l.name}</option>)}</select></div>
        <div className="field"><label>Termék</label><input disabled value={`${item.brand} ${item.model}`} /></div>
        <div className="row2"><div className="field"><label>Vevő neve</label><input value={f.customerName} onChange={set("customerName")} placeholder="Kovács János" /></div><div className="field"><label>Telefonszám</label><input value={f.customerPhone} onChange={set("customerPhone")} placeholder="07xx xxx xxx" /></div></div>
        <div className="row2"><div className="field"><label>Eladási ár (Lei)</label><input type="number" value={f.price} onChange={set("price")} /></div><div className="field"><label>Fizetés</label><select value={f.payment} onChange={set("payment")}><option>Készpénz</option><option>Kártya</option><option>Átutalás</option></select></div></div>
        <div className="modal-actions"><button className="btn secondary" onClick={onClose}>Mégse</button><button className="btn" disabled={busy} onClick={()=>onSave({stockId:item.id,productLabel:`${item.brand} ${item.model}`,costPrice:item.costPrice,...f},locId)}>{busy?"Mentés...":"Eladás rögzítése"}</button></div>
      </div>
    </div>
  );
}

function ServiceModal({ locations, onClose, onSave, busy, defaultLocId }) {
  const [f, setF] = useState({ customerName:"", customerPhone:"", device:"", issue:"", price:"" });
  const [locId, setLocId] = useState(defaultLocId||"");
  const set = k => e => setF({...f,[k]:e.target.value});
  const valid = f.customerName.trim()&&f.device.trim()&&f.issue.trim()&&locId;
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <h2>Új munkalap <button className="iconbtn" onClick={onClose}>✕</button></h2>
        <div className="field"><label>Helyszín</label><select value={locId} onChange={e=>setLocId(e.target.value)}>{locations.map(l=><option key={l.id} value={l.id}>{l.name}</option>)}</select></div>
        <div className="row2"><div className="field"><label>Vevő neve</label><input value={f.customerName} onChange={set("customerName")} placeholder="Kovács János" /></div><div className="field"><label>Telefonszám</label><input value={f.customerPhone} onChange={set("customerPhone")} placeholder="07xx xxx xxx" /></div></div>
        <div className="field"><label>Eszköz</label><input value={f.device} onChange={set("device")} placeholder="iPhone 12" /></div>
        <div className="field"><label>Hiba leírása</label><textarea rows={3} value={f.issue} onChange={set("issue")} placeholder="Nem tölt, akku csere..." /></div>
        <div className="field"><label>Becsült díj (Lei)</label><input type="number" value={f.price} onChange={set("price")} placeholder="0" /></div>
        <div className="modal-actions"><button className="btn secondary" onClick={onClose}>Mégse</button><button className="btn" disabled={!valid||busy} onClick={()=>valid&&onSave(f,locId)}>{busy?"Mentés...":"Létrehozás"}</button></div>
      </div>
    </div>
  );
}

function PartModal({ onClose, onSave, busy }) {
  const [f, setF] = useState({ name:"", brand:"", modelFit:"", quantity:"", costPrice:"", salePrice:"" });
  const set = k => e => setF({...f,[k]:e.target.value});
  const valid = f.name.trim()&&f.quantity!==""&&f.salePrice!=="";
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <h2>Új alkatrész <button className="iconbtn" onClick={onClose}>✕</button></h2>
        <div className="field"><label>Megnevezés</label><input value={f.name} onChange={set("name")} placeholder="Kijelző, akku, töltőcsatlakozó..." /></div>
        <div className="row2"><div className="field"><label>Márka</label><input value={f.brand} onChange={set("brand")} placeholder="Apple" /></div><div className="field"><label>Mire illik</label><input value={f.modelFit} onChange={set("modelFit")} placeholder="iPhone 12, 13" /></div></div>
        <div className="row3"><div className="field"><label>Mennyiség (db)</label><input type="number" value={f.quantity} onChange={set("quantity")} placeholder="0" /></div><div className="field"><label>Besz. ár (Lei)</label><input type="number" value={f.costPrice} onChange={set("costPrice")} placeholder="0" /></div><div className="field"><label>Elad. ár (Lei)</label><input type="number" value={f.salePrice} onChange={set("salePrice")} placeholder="0" /></div></div>
        <div className="modal-actions"><button className="btn secondary" onClick={onClose}>Mégse</button><button className="btn" disabled={!valid||busy} onClick={()=>valid&&onSave(f)}>{busy?"Mentés...":"Hozzáadás"}</button></div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
